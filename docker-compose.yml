services:
  # Full app: FastAPI backend serving React frontend
  app:
    build:
      context: .
      target: prod
    image: options_analyzer:prod
    ports:
      - "9000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    mem_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: python -m uvicorn ui.app:app --host 0.0.0.0 --port 8000

  # Run the full test suite
  test:
    build:
      context: .
      target: dev
    image: options_analyzer:dev
    volumes:
      - ./data:/app/data
    command: python -m pytest tests/ -v --ignore=tests/_parked

  # CLI scanner (one-off runs)
  scan:
    image: options_analyzer:prod
    env_file: .env
    command: python scripts/scan.py SPY,QQQ,IWM --strategies --top 10

  # Backtester (one-off runs)
  backtest:
    image: options_analyzer:prod
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python scripts/run_backtest.py --strategy iron_condor --symbol SPY

  # Daily chain snapshot collector
  collect:
    image: options_analyzer:prod
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python scripts/collect_chains.py SPY,QQQ,^SPX,^NDX,IWM,META,AAPL,AMZN,NFLX,GOOG --max-dte 60

  # Alpaca historical options backfill
  backfill:
    image: options_analyzer:prod
    env_file: .env
    volumes:
      - ./data:/app/data
    command: python scripts/backfill_chains.py SPY --start 2025-04-01 --end 2025-05-01

  # ThetaData historical options backfill (requires Theta Terminal on host)
  backfill-theta:
    image: options_analyzer:prod
    env_file: .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python scripts/backfill_thetadata.py --start 2020-01-01 --end 2025-12-31

  # Interactive shell with full dev environment
  shell:
    image: options_analyzer:dev
    stdin_open: true
    tty: true
    env_file: .env
    volumes:
      - .:/app
      - ./data:/app/data
    command: bash
