# Multi-Agent Paper Trading Configuration
#
# Each agent is a filter profile applied to the same L1→L2 pipeline output.
# The orchestrator builds MarketState once per ticker, generates candidates
# once, then filters per-agent. Agents share a portfolio risk budget
# enforced by the orchestrator's guardrails.
#
# To add an agent: add a new entry under `agents:` with desired parameters.
# To pause an agent: set `enabled: false` or use CLI `--pause <agent_id>`.
# To remove: delete the entry. Open trades continue to be monitored.

orchestrator:
  portfolio_value: 100000
  tickers: [SPY, QQQ, IWM]

  # Portfolio-level guardrails
  guardrails:
    max_total_positions: 12
    max_positions_per_ticker: 4
    max_notional_exposure_pct: 0.15
    daily_drawdown_limit_pct: 0.03
    weekly_drawdown_limit_pct: 0.05
    max_same_direction_exposure: 3
    portfolio_kill_switch_pct: 0.08

agents:
  conservative:
    enabled: true
    capital_pct: 0.25
    min_confluence: 75
    allowed_strategies: [butterfly, short_put_spread]
    required_regimes: [HIGH_IV]
    max_positions: 3
    max_daily_loss_pct: 0.01
    drawdown_pause_pct: 0.04
    description: "High-conviction credit + butterfly, HIGH_IV only"

  momentum:
    enabled: false
    capital_pct: 0.15
    min_confluence: 70
    allowed_strategies: [long_call_spread, long_put_spread]
    required_regimes: [LOW_IV]
    required_bias_strength: 3
    min_dte: 7
    max_positions: 3
    max_daily_loss_pct: 0.015
    drawdown_pause_pct: 0.05
    description: "DISABLED — debit spreads at 0-14 DTE have negative expectancy. Revisit for swing tier."

  vol_harvester:
    enabled: true
    capital_pct: 0.20
    min_confluence: 70
    allowed_strategies: [short_put_spread, butterfly]
    required_regimes: [HIGH_IV]
    min_iv_rv_edge_pct: 5.0
    max_positions: 3
    max_daily_loss_pct: 0.015
    drawdown_pause_pct: 0.05
    description: "Credit selling in HIGH_IV with edge"

  opportunistic:
    enabled: true
    capital_pct: 0.10
    min_confluence: 65
    allowed_strategies: [iron_condor, butterfly, short_put_spread, short_call_spread]
    required_regimes: [HIGH_IV]
    max_positions: 3
    max_daily_loss_pct: 0.01
    drawdown_pause_pct: 0.03
    description: "Wider credit net, iron condors + butterflies, HIGH_IV only"

  # ── Swing (14-60 DTE) ─────────────────────────────────────────────
  swing_harvester:
    enabled: true
    dte_tier: swing
    capital_pct: 0.10
    min_confluence: 65
    allowed_strategies: [calendar_spread, diagonal_spread, long_straddle]
    required_regimes: [HIGH_IV, LOW_IV]
    max_positions: 3
    max_daily_loss_pct: 0.015
    drawdown_pause_pct: 0.05
    description: "VRP + term structure, 14-60 DTE calendars/diagonals/straddles"

  # ── Medium-term (30-90 DTE) ──────────────────────────────────────
  medium_term_harvester:
    enabled: true
    dte_tier: medium_term
    capital_pct: 0.20
    min_confluence: 70
    allowed_strategies: [mt_calendar_spread, mt_diagonal_spread, mt_long_straddle, mt_iron_butterfly]
    required_regimes: [HIGH_IV, LOW_IV]
    max_positions: 4
    max_daily_loss_pct: 0.015
    drawdown_pause_pct: 0.05
    description: "VRP + skew driven premium harvesting, 30-90 DTE, skip MODERATE_IV"

  # ── Long-term (90-180 DTE) ───────────────────────────────────────
  long_term_harvester:
    enabled: true
    dte_tier: long_term
    capital_pct: 0.10
    min_confluence: 60
    allowed_strategies: [lt_calendar_spread, lt_diagonal_spread, lt_long_straddle]
    required_regimes: [HIGH_IV, LOW_IV]
    max_positions: 3
    max_daily_loss_pct: 0.01
    drawdown_pause_pct: 0.04
    description: "Cross-asset + correlation driven, 90-180 DTE, skip MODERATE_IV"
